name: ci

# Continuous integration for the course: byte-compile every Python
# file, then run every chapter's test suite on Python 3.11 and 3.12.
# The test step is scripts/run_checks.py, which runs each chapter's
# tests in that chapter's own code/ directory and reports per
# chapter: passed, failed, blocked (a missing third-party package),
# or no tests. Live tests that need a model API key skip themselves
# when no backend is configured, so this runs with no secrets.
# The shape follows the eval-gate example in Chapter 10
# (chapter-10-trajectory-evals-ci-gates/code/eval-gate.yml), which
# is the course's own example of a workflow that fails the build
# when its gate fails.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Chapter 2's tests import pydantic; every other chapter's
        # tests run on the standard library alone.
        run: pip install pydantic

      - name: Byte-compile all Python files
        run: python -m compileall -q .

      - name: Run all chapter test suites
        run: python scripts/run_checks.py
